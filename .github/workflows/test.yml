name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate dependency compatibility
        run: |
          python -m pip check
          python -c "from fastapi.testclient import TestClient; import fastapi, starlette, httpx; print(fastapi.__version__, starlette.__version__, httpx.__version__)"
      - name: Migrate dedicated CI database
        env:
          AGENT_DATABASE_URL: postgresql://agent_test:ci_only_password@127.0.0.1:5432/agent_test
        run: alembic upgrade head
      - name: SQLite regressions and PostgreSQL integration
        env:
          TEST_POSTGRES_DSN: postgresql://agent_test:ci_only_password@127.0.0.1:5432/agent_test
        run: python -m pytest -q -rs
      - name: Publish synthetic semantic baseline (not a live model score)
        run: |
          python -m agent.eval_goals --mode fixture --fail-on-critical > semantic-baseline.json
          python -c "import json; print(json.dumps(json.load(open('semantic-baseline.json'))['metrics'], ensure_ascii=False))"
      - uses: actions/upload-artifact@v6
        with:
          name: semantic-fixture-baseline
          path: semantic-baseline.json
      - name: Publish synthetic multi-turn session baseline
        run: |
          python -m agent.eval_sessions --mode fixture --fail-on-critical > session-baseline.json
          python -c "import json; print(json.dumps(json.load(open('session-baseline.json'))['metrics'], ensure_ascii=False))"
      - uses: actions/upload-artifact@v6
        with:
          name: multi-turn-session-fixture-baseline
          path: session-baseline.json
